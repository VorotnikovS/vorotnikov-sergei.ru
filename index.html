<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Portfolio of Sergei Vorotnikov</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background-color: black;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #loading-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
    }
  </style>

  <script>
    async function loadRiveWithProgress(url) {
      const response = await fetch(url);
      const contentLength = response.headers.get("Content-Length");

      if (!response.ok || !contentLength) {
        throw new Error("❌ Не удалось загрузить файл или определить его размер.");
      }

      const total = parseInt(contentLength, 10);
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;

      const progressElement = document.getElementById("loading-progress");

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        chunks.push(value);
        received += value.length;

        const percent = Math.floor((received / total) * 100);
        progressElement.textContent = `${percent}%`;
      }

      document.getElementById("loading-container").style.display = "none";

      const blob = new Blob(chunks);
      return await blob.arrayBuffer();
    }

    async function startRive(isMobile) {
      const canvas = document.getElementById("rive-canvas");
      const riveFile = isMobile ? "" : "main.riv";

      let scrollYInput;
      let goToWWInput;
      let goToMathInput;
      let ButtonBackInput;
      let goAppStoreWWInput;
      let GoGooglePlayMathInput;
      let GoAppStoreMathInput;

      let velocityY = 0;
      let isTouching = false;

      function resizeCanvas(riveInstance) {
        const dpr = isMobile ? 1 : window.devicePixelRatio || 1;

        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";

        if (riveInstance) {
          riveInstance.resizeDrawingSurfaceToCanvas();
        }
      }

      resizeCanvas();

      const riveInstance = new rive.Rive({
        buffer: await loadRiveWithProgress(riveFile),
        canvas: canvas,
        autoplay: true,
        artboard: "Main",
        stateMachines: "State Machine 1",

        // Главное изменение:
        // Rive сам привяжет дефолтный ViewModel Instance к artboard/state machine.
        autoBind: true,

        layout: new rive.Layout({
          fit: rive.Fit.FitWidth,
          alignment: rive.Alignment.TopCenter
        }),

        onLoad: () => {
          resizeCanvas(riveInstance);

          const vmi = riveInstance.viewModelInstance;

          if (!vmi) {
            console.error("❌ ViewModelInstance не найден. Проверь, что в Rive Editor назначен Default ViewModel и Default Instance.");
            return;
          }

          const sizeInput = vmi.number("Size");
          if (sizeInput) {
            sizeInput.value = window.innerWidth;
          }

          scrollYInput = vmi.number("ScrollY");

          goToWWInput = vmi.boolean("GoToWW");
          goToMathInput = vmi.boolean("goToMath");
          ButtonBackInput = vmi.boolean("ButtonBack");

          goAppStoreWWInput = vmi.boolean("GoAppStoreWW");
          GoGooglePlayMathInput = vmi.boolean("GoGooglePlayMath");
          GoAppStoreMathInput = vmi.boolean("GoAppStoreMath");

          monitorTriggerFlag();
        },

        onError: (err) => console.error("❌ Ошибка Rive:", err)
      });

      window.addEventListener("resize", () => {
        resizeCanvas(riveInstance);

        const vmi = riveInstance.viewModelInstance;
        const sizeInput = vmi?.number("Size");

        if (sizeInput) {
          sizeInput.value = window.innerWidth;
        }
      });

      if (isMobile) {
        let lastY = null;

        window.addEventListener("touchmove", (e) => {
          if (!scrollYInput) return;

          if (lastY === null) {
            lastY = e.touches[0].clientY;
            return;
          }

          const deltaY = lastY - e.touches[0].clientY;

          velocityY = deltaY * 0.7;
          velocityY = Math.max(-30, Math.min(30, velocityY));

          scrollYInput.value += velocityY;
          scrollYInput.value = Math.max(0, Math.min(4000, scrollYInput.value));

          lastY = e.touches[0].clientY;
          isTouching = true;
        }, { passive: true });

        window.addEventListener("touchend", () => {
          lastY = null;
          isTouching = false;
        });
      } else {
        window.addEventListener("wheel", (e) => {
          if (!scrollYInput) return;

          scrollYInput.value += e.deltaY * 0.3;
          scrollYInput.value = Math.max(0, Math.min(4000, scrollYInput.value));
        });
      }

      function monitorTriggerFlag() {
        if (goToWWInput?.value) {
          goToWWInput.value = false;
          const scrollTarget = isMobile ? 1320 : 1285;
          animateScrollYTo(scrollTarget);
        }

        if (goToMathInput?.value) {
          goToMathInput.value = false;
          const scrollTarget = isMobile ? 2572 : 2474;
          animateScrollYTo(scrollTarget);
        }

        if (ButtonBackInput?.value) {
          ButtonBackInput.value = false;
          animateScrollYTo(0);
        }

        if (goAppStoreWWInput?.value) {
          goAppStoreWWInput.value = false;

          const link = "https://apps.apple.com/ru/app/wake-the-world-my-map/id1529898421?l=en-GB";

          if (isMobile) {
            window.location.href = link;
          } else {
            window.open(link, "_blank");
          }
        }

        if (GoGooglePlayMathInput?.value) {
          GoGooglePlayMathInput.value = false;

          const link = "https://play.google.com/store/apps/details?id=com.example.mathgame";

          if (isMobile) {
            window.location.href = link;
          } else {
            window.open(link, "_blank");
          }
        }

        if (GoAppStoreMathInput?.value) {
          GoAppStoreMathInput.value = false;

          const link = "https://apps.apple.com/us/app/math-game-mental-mastery/id6745556295";

          if (isMobile) {
            window.location.href = link;
          } else {
            window.open(link, "_blank");
          }
        }

        updateInertia();
        requestAnimationFrame(monitorTriggerFlag);
      }

      function updateInertia() {
        if (!scrollYInput || isTouching) return;

        if (Math.abs(velocityY) > 0.1) {
          scrollYInput.value += velocityY;
          scrollYInput.value = Math.max(0, Math.min(4000, scrollYInput.value));
          velocityY *= 0.95;
        } else {
          velocityY = 0;
        }
      }

      function animateScrollYTo(targetValue) {
        if (!scrollYInput) return;

        const duration = 600;
        const startValue = scrollYInput.value;
        const startTime = performance.now();

        function step(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeInOutQuad(progress);

          scrollYInput.value = startValue + (targetValue - startValue) * eased;

          if (progress < 1) {
            requestAnimationFrame(step);
          }
        }

        requestAnimationFrame(step);
      }

      function easeInOutQuad(t) {
        return t < 0.5
          ? 2 * t * t
          : -1 + (4 - 2 * t) * t;
      }
    }

    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    const script = document.createElement("script");

    // Для ViewModel/Data Binding нужен webgl2.
    // Да, Rive опять поменял входную дверь в дом.
    script.src = "https://unpkg.com/@rive-app/webgl2@2";

    script.onload = () => startRive(isMobile);
    script.onerror = () => console.error("❌ Не удалось загрузить Rive runtime.");

    document.head.appendChild(script);
  </script>
</head>

<body>
  <canvas id="rive-canvas"></canvas>
  <div id="loading-container">Загрузка: <span id="loading-progress">0%</span></div>
</body>
</html>
